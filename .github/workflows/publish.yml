name: Publish LMS plugins
on:
  push:
    branches: [main]
    paths: ['Plugins/**', 'scripts/**', 'tests/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lms-plugin-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy==2.2.6 py3langid==0.4.0
      - name: Test translation helper
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test Radio Stations
        run: |
          sudo apt-get update
          sudo apt-get install -y libjson-xs-perl liburi-perl
          prove tests/radiostations-*.t
      - name: Build and publish plugins and repository index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish.py --publish
